<style>:root{--bg:#07080d;--tx:#f4f5f8;--mu:#8d93a3;--ln:rgba(255,255,255,.09);--gl:rgba(255,255,255,.045);--ac:#d4ff6a;--g:linear-gradient(135deg,#d4ff6a,#35e0b5);box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg);color-scheme:dark;overflow-x:hidden}
body{margin:0 auto;color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 140px;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden}#bg i{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.3;animation:fl 16s ease-in-out infinite alternate}#bg i:nth-child(1){background:#5b3df5;top:-150px;left:-130px}#bg i:nth-child(2){background:#14c99a;bottom:-170px;right:-150px;animation-delay:-8s}@keyframes fl{to{transform:translate(60px,50px) scale(1.15)}}
.v>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both}.v>*:nth-child(2){animation-delay:55ms}.v>*:nth-child(3){animation-delay:110ms}.v>*:nth-child(n+4){animation-delay:165ms}@keyframes up{from{opacity:0;transform:translateY(18px) scale(.985)}}
.k{color:var(--mu);font-size:13px}.mb{margin-bottom:10px}.t2{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-bottom:12px}.t3{font-weight:700;margin-bottom:10px}.gl2{margin:16px 2px 10px}
.wm{font-size:26px;font-weight:800;letter-spacing:-.04em}.wm b,.big{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}.big{font-size:32px;font-weight:800;letter-spacing:-.04em;line-height:1.15;margin:2px 0 6px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card,.hero{background:var(--gl);border:1px solid var(--ln);border-radius:24px;padding:16px;margin-bottom:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hero{display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,rgba(212,255,106,.11),rgba(53,224,181,.04))}
.ring{position:relative;width:112px;height:112px;flex:none}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:9;stroke-linecap:round}.rb{stroke:rgba(255,255,255,.09)}.rf{stroke:url(#gg);stroke-dasharray:327;stroke-dashoffset:var(--o);animation:rg 1.4s cubic-bezier(.2,.8,.2,1) both}.rf.ov{stroke:#ff7a8a}@keyframes rg{from{stroke-dashoffset:327}}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.ring b{font-size:26px;font-weight:800;line-height:1}.ring span{font-size:9px;color:var(--mu);letter-spacing:.14em}
.pos{color:var(--ac)}.neg{color:#ff7a8a}
.btn{width:100%;padding:14px;border:0;border-radius:16px;background:var(--g);color:#0b0d12;font-weight:800;font-size:16px;margin-top:12px;box-shadow:0 8px 28px rgba(53,224,181,.28);transition:transform .15s}.btn:active{transform:scale(.97)}
.ghost{width:100%;display:block;background:transparent;border:1px dashed rgba(255,255,255,.18);color:var(--mu);padding:12px;border-radius:14px;font-weight:600;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{padding:8px 14px;border-radius:99px;background:var(--gl);border:1px solid var(--ln);font-weight:600;font-size:13px}.chip.on{background:var(--g);color:#0b0d12;border-color:transparent}
input,select{width:100%;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--ln);color:var(--tx);border-radius:14px;padding:12px;font:16px system-ui;outline:0}input:focus,select:focus{border-color:var(--ac)}select option{background:#12141c}
.lb{display:block;color:var(--mu);font-size:13px;margin:12px 0 6px}.err{color:#ff7a8a;font-size:13px;min-height:18px;margin:8px 0 0}
.mr{display:grid;grid-template-columns:100px 1fr 82px;gap:10px;align-items:center;font-size:13px;margin:8px 0}.mr em{font-style:normal;color:var(--mu);text-align:right;font-size:12px}.mb2{height:8px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}.mb2 b{display:block;height:100%;background:var(--g);border-radius:9px;animation:wd 1s cubic-bezier(.2,.8,.2,1) both}@keyframes wd{from{width:0}}
.h{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln);font-size:14px}.card .h:first-of-type{border-top:0}.ic{width:40px;height:40px;border-radius:12px;background:var(--gl);border:1px solid var(--ln);display:grid;place-items:center;font-size:19px;flex:none}.gr{flex:1;min-width:0;overflow-wrap:anywhere}.gr small{display:block;color:var(--mu);font-size:12px}.h b{white-space:nowrap}.x{background:none;border:0;color:var(--mu);font-size:16px;padding:6px 8px}
.st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}.st div{background:var(--gl);border:1px solid var(--ln);border-radius:20px;padding:14px 6px;text-align:center}.st b{display:block;font-size:16px;font-weight:800;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}.st span{font-size:11px;color:var(--mu)}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin:14px 0 4px}.bars i{flex:1;background:var(--g);border-radius:10px 10px 4px 4px;transform-origin:bottom;animation:gr .8s cubic-bezier(.2,.8,.2,1) both}@keyframes gr{from{transform:scaleY(0)}}.lbs{display:flex;gap:8px}.lbs span{flex:1;text-align:center;font-size:11px;color:var(--mu)}
.hide{display:none!important}
nav{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:6}
.nv{position:relative;display:grid;grid-template-columns:repeat(4,1fr);width:min(92%,420px);padding:6px;border-radius:28px;background:rgba(20,22,30,.74);border:1px solid var(--ln);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 14px 44px rgba(0,0,0,.55);pointer-events:auto}
.nv u{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:22px;background:var(--g);opacity:.17;transition:transform .5s cubic-bezier(.2,.9,.3,1.12);transform:translateX(calc(var(--n,0)*100%))}
.nv button{position:relative;background:none;border:0;color:var(--mu);font-weight:700;font-size:11px;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .3s}.nv svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s}.nv .on{color:var(--ac)}.nv .on svg{transform:translateY(-2px) scale(1.1)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(98px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--g);color:#0b0d12;font-size:32px;font-weight:300;line-height:1;box-shadow:0 10px 30px rgba(53,224,181,.4);z-index:7;transition:transform .15s}.fab:active{transform:scale(.92)}
#sh{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}.bd{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fi .3s both}@keyframes fi{from{opacity:0}}
.sheet{position:relative;width:100%;max-width:560px;max-height:90vh;overflow:auto;background:#12141c;border:1px solid var(--ln);border-radius:28px 28px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:sl .45s cubic-bezier(.2,.9,.3,1) both}@keyframes sl{from{transform:translateY(100%)}}
@media(min-width:600px){#sh{align-items:center}.sheet{border-radius:28px}}
#ts{position:fixed;left:50%;bottom:calc(168px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1c1f2b;border:1px solid var(--ln);padding:11px 18px;border-radius:99px;opacity:0;transition:all .35s;z-index:30;pointer-events:none;font-weight:600;font-size:14px;white-space:nowrap}#ts.show{opacity:1;transform:translate(-50%,0)}
#spl{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 42%,#1a1d33,#07080d 72%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;transition:opacity .3s,transform .35s;pointer-events:none}#spl.out{opacity:0;transform:scale(1.06)}#spl .wm{font-size:36px}.sbt{color:var(--mu);font-size:12px;letter-spacing:.18em}
.eq{display:flex;gap:6px;align-items:flex-end;height:48px;justify-content:center;margin:10px 0}.eq i{width:7px;height:10px;border-radius:4px;background:var(--g);animation:eq 1s ease-in-out infinite}.eq i:nth-child(2){animation-delay:.12s}.eq i:nth-child(3){animation-delay:.24s}.eq i:nth-child(4){animation-delay:.36s}.eq i:nth-child(5){animation-delay:.48s}@keyframes eq{50%{height:46px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}</style></head>
