<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6c5ce7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MoneyFlow">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Mi Dinero</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1a1b2e;--mu:#7b7f99;--br:#e6e8f2;--ac:#6c5ce7;--in:#00b894;--ex:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11121c;--card:#1b1d2e;--tx:#f1f2fa;--mu:#8e92b0;--br:#2a2d44}}
:root[data-theme="dark"]{--bg:#11121c;--card:#1b1d2e;--tx:#f1f2fa;--mu:#8e92b0;--br:#2a2d44}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.w{max-width:560px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:20px;margin:6px 0 14px;display:flex;justify-content:space-between;align-items:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
.th{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--br);font-size:18px}
.hero{background:linear-gradient(135deg,#6c5ce7,#a29bfe 60%,#74b9ff);color:#fff;border-radius:24px;padding:22px;box-shadow:0 14px 30px rgba(108,92,231,.35)}
.hero small{opacity:.85}.hero b{display:block;font-size:36px;margin:4px 0 16px;letter-spacing:-1px}
.row{display:flex;gap:10px}.chip{flex:1;background:rgba(255,255,255,.18);border-radius:16px;padding:10px 12px;font-size:13px}
.chip b{font-size:16px;margin:2px 0 0}
.card{background:var(--card);border:1px solid var(--br);border-radius:20px;padding:16px;margin-top:16px}
.card h2{font-size:15px;margin:0 0 12px}
.tabs{display:flex;gap:6px;margin-top:16px;overflow-x:auto}
.tab{padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--br);font-size:13px;white-space:nowrap}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--br)}.it:last-child{border:0}
.ic{width:42px;height:42px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}
.it div.m{flex:1;min-width:0}.it .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it .d{font-size:12px;color:var(--mu)}
.am{font-weight:700;white-space:nowrap}.am.i{color:var(--in)}.am.e{color:var(--ex)}
.x{width:34px;height:34px;border-radius:10px;color:var(--mu);font-size:16px}.x:active{background:var(--bg)}
.bar{margin:10px 0}.bar span{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar i{display:block;height:8px;border-radius:9px;background:var(--bg);overflow:hidden}.bar i u{display:block;height:100%;border-radius:9px;background:var(--ac)}
.em{text-align:center;color:var(--mu);padding:22px 0;font-size:14px}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 10px 24px rgba(108,92,231,.5);z-index:5}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov.on{display:flex}
.sh{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto}
@media(min-width:600px){.ov{align-items:center}.sh{border-radius:26px}}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:600}.seg .on{background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.12)}
input,select{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--br);border-radius:14px;padding:13px;margin-bottom:10px;outline:0}
input:focus,select:focus{border-color:var(--ac)}
.go{width:100%;padding:15px;border-radius:14px;background:var(--ac);color:#fff;font-weight:700;font-size:16px}
.err{color:var(--ex);font-size:13px;min-height:18px;margin-bottom:6px}
.lic{text-align:center;color:var(--mu);font-size:12px;margin-top:18px}</style></head><body>
<div class="w">
<h1>💰 Mi Dinero <button type="button" class="th" id="th" aria-label="Tema">🌓</button></h1>
<div class="hero"><small>Balance total</small><b id="bal">0,00 €</b>
<div class="row"><div class="chip">⬇ Ingresos<b id="inc">0 €</b></div><div class="chip">⬆ Gastos<b id="exp">0 €</b></div></div></div>
<div class="card"><h2>Gastos por categoría</h2><div id="cats"></div></div>
<div class="tabs" id="tabs"></div>
<div class="card" style="margin-top:10px"><div id="list"></div></div>
<p class="lic">© 2026 RamiOO7 · Licencia MIT</p>
</div>
<button type="button" class="fab" id="fab" aria-label="Añadir">+</button>
<div class="ov" id="ov"><div class="sh">
<div class="seg"><button type="button" id="se" class="on">Gasto</button><button type="button" id="si">Ingreso</button></div>
<input id="amt" type="number" inputmode="decimal" placeholder="Cantidad" step="0.01" min="0">
<input id="ttl" type="text" placeholder="Descripción (opcional)" maxlength="40">
<select id="cat"></select>
<input id="dt" type="date">
<div class="err" id="err"></div>
<button type="button" class="go" id="save">Guardar</button>
<button type="button" class="go" id="cancel" style="background:var(--bg);color:var(--mu);margin-top:8px">Cancelar</button>
</div></div>
